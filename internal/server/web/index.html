<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gossh</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
  <style>
    html, body { margin: 0; height: 100%; background: #050811; }
    #terminal { position: fixed; inset: 0; padding: 12px; }
    .xterm-viewport { background-color: #050811 !important; }
  </style>
</head>
<body>
  <div id="terminal"></div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
  <script>
    (() => {
      // ---------- Terminal setup ----------
      const term = new Terminal({
        cursorBlink: true,
        fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
        fontSize: 14,
        scrollback: 5000,
        theme: { background: '#050811', foreground: '#e5e7eb', cursor: '#e5e7eb' }
      });
      const fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.open(document.getElementById('terminal'));
      fit.fit();
      term.focus();

      // ---------- Colors for messages ----------
      const DIM = '\x1b[90m', RED = '\x1b[31m', GREEN = '\x1b[32m',
            CYAN = '\x1b[36m', BOLD = '\x1b[1m', RESET = '\x1b[0m';
      const say = (text = '') => term.writeln(text);

      // ---------- State ----------
      // 'username' -> 'password' -> 'connecting' -> 'session'
      let state = 'username';
      let username = '';
      let password = '';
      let socket = null;
      let failed = false;

      function showInstructions() {
        say(BOLD + CYAN + 'gossh' + RESET + DIM + '  web SSH terminal' + RESET);
        say('');
        say('How to log in:');
        say('  1. Type your SSH username and press ' + BOLD + 'Enter' + RESET + '.');
        say('  2. Type your SSH password and press ' + BOLD + 'Enter' + RESET + '.');
        say('     ' + DIM + 'Nothing shows on screen while you type the password. That is normal.' + RESET);
        say('  3. Wait a moment. Your SSH session starts in this same window.');
        say('');
        say('github: www.github.com/ankushT369/gossh');
        say('');
        say(DIM + 'Tips:' + RESET);
        say(DIM + '  Backspace deletes a letter.' + RESET);
        say(DIM + '  Ctrl+C cancels and goes back to the username step.' + RESET);
        say(DIM + '  Your login is sent only to this app and is not saved.' + RESET);
        say(DIM + '  Check your SSH host key before you trust the server.' + RESET);
        say('');
      }

      function askUsername() {
        state = 'username';
        username = '';
        password = '';
        term.write(GREEN + 'username: ' + RESET);
      }

      function askPassword() {
        state = 'password';
        password = '';
        term.write(GREEN + 'password: ' + RESET);
      }

      // ---------- Talking to the server ----------
      function send(value) {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify(value));
        }
      }

      function connect() {
        state = 'connecting';
        failed = false;
        say(DIM + 'Connecting...' + RESET);

        const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
        socket = new WebSocket(`${scheme}//${location.host}/webterm-ws`);

        socket.addEventListener('open', () => {
          send({ type: 'auth', username, password, cols: term.cols, rows: term.rows });
          password = ''; // forget the password right after sending
        });

        socket.addEventListener('message', event => {
          let msg;
          try { msg = JSON.parse(event.data); } catch { return; }

          if (msg.type === 'output') {
            if (state === 'connecting') state = 'session';
            term.write(msg.data);
          } else if (msg.type === 'status') {
            if (state !== 'session') say(DIM + msg.data + RESET);
            if (/^connected/i.test(msg.data)) state = 'session';
          } else if (msg.type === 'error') {
            failed = true;
            say('');
            say(RED + msg.data + RESET);
          }
        });

        socket.addEventListener('close', () => {
          const wasSession = state === 'session';
          socket = null;
          say('');
          if (failed) {
            say(RED + 'Login failed. Please try again.' + RESET);
          } else if (wasSession) {
            say(DIM + 'Connection closed.' + RESET);
          } else {
            say(RED + 'Could not connect to the server.' + RESET);
          }
          say('');
          askUsername();
        });

        socket.addEventListener('error', () => { /* 'close' will follow and print the message */ });
      }

      // ---------- Keyboard handling ----------
      term.onData(data => {
        // Once the SSH session is running, pass every key straight through.
        if (state === 'session') {
          send({ type: 'input', data });
          return;
        }
        if (state === 'connecting') return; // ignore keys while connecting

        // Login steps: handle the keys ourselves.
        for (const ch of data) {
          if (ch === '\r') {                       // Enter
            term.write('\r\n');
            if (state === 'username') {
              if (username.trim() === '') { askUsername(); return; }
              askPassword();
            } else if (state === 'password') {
              connect();
              return;
            }
          } else if (ch === '\x7f' || ch === '\b') { // Backspace
            if (state === 'username' && username.length > 0) {
              username = username.slice(0, -1);
              term.write('\b \b');
            } else if (state === 'password') {
              password = password.slice(0, -1);
            }
          } else if (ch === '\x03') {              // Ctrl+C
            say('^C');
            askUsername();
            return;
          } else if (ch >= ' ' && ch !== '\x7f') { // normal typed or pasted letter
            if (state === 'username') {
              username += ch;
              term.write(ch);                      // username is shown
            } else if (state === 'password') {
              password += ch;                      // password is NOT shown
            }
          }
          // anything else (arrow keys, etc.) is ignored during login
        }
      });

      term.onResize(size => send({ type: 'resize', cols: size.cols, rows: size.rows }));

      window.addEventListener('resize', () => fit.fit());
      document.addEventListener('click', () => term.focus());

      // ---------- Start ----------
      showInstructions();
      askUsername();
    })();
  </script>
</body>
</html>
